{% extends "base.html" %}

{% block title %}Assistant IA{% endblock %}

{% block content %}
<style>
    .chat-layout {
        display: flex;
        height: calc(100vh - 130px);
        gap: 1rem;
    }
    .history-panel {
        width: 260px;
        background: white;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .history-header {
        padding: 1rem;
        border-bottom: 1px solid #e2e8f0;
        font-weight: 600;
    }
    .history-list {
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem;
    }
    .history-item {
        padding: 0.7rem 0.9rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9rem;
        color: #334155;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .history-item:hover, .history-item.active {
        background: #f1f5f9;
    }
    .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: white;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        overflow: hidden;
    }
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
        background: #f8fafc;
    }
    .message {
        display: flex;
        margin-bottom: 1.25rem;
        animation: fadeIn 0.25s ease;
    }
    .message.user { justify-content: flex-end; }
    .message-content {
        max-width: 75%;
        padding: 0.85rem 1.15rem;
        border-radius: 18px;
        line-height: 1.5;
        white-space: pre-wrap;
    }
    .message.bot .message-content {
        background: white;
        border: 1px solid #e2e8f0;
        border-bottom-left-radius: 4px;
    }
    .message.user .message-content {
        background: #2563eb;
        color: white;
        border-bottom-right-radius: 4px;
    }
    .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-right: 10px;
        background: #2563eb;
        color: white;
    }
    .message.user .avatar { display: none; }
    .chat-input-area {
        padding: 1rem 1.25rem;
        border-top: 1px solid #e2e8f0;
        background: white;
    }
    .typing-indicator {
        display: none;
        color: #64748b;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
    }
    .typing-indicator.active { display: block; }
    .suggestion-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
    }
    .chip {
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 0.35rem 0.85rem;
        font-size: 0.82rem;
        cursor: pointer;
        transition: all 0.2s;
    }
    .chip:hover {
        background: #2563eb;
        color: white;
        border-color: #2563eb;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h3 class="fw-bold mb-0">
            <i class="bi bi-robot text-primary me-2"></i>Assistant IA
        </h3>
        <small class="text-muted">Contextuel • Gemini 3.8 Flash</small>
    </div>
    <button id="btn-new-chat" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-lg me-1"></i> Nouvelle discussion
    </button>
</div>

<div class="chat-layout">
    <!-- Panneau Historique -->
    <div class="history-panel">
        <div class="history-header d-flex justify-content-between align-items-center">
            <span>Historique</span>
            <button id="btn-clear-all" class="btn btn-sm btn-link text-danger p-0" title="Tout effacer">
                <i class="bi bi-trash"></i>
            </button>
        </div>
        <div class="history-list" id="history-list">
            <!-- Les discussions apparaîtront ici -->
        </div>
    </div>

    <!-- Zone de chat principale -->
    <div class="chat-main">
        <div class="chat-messages" id="chat-messages">
            <!-- Messages -->
        </div>

        <div class="chat-input-area">
            <div class="suggestion-chips" id="suggestions">
                <div class="chip" data-msg="Quels sont mes projets ?">Mes projets</div>
                <div class="chip" data-msg="Y a-t-il des projets à risque ?">Projets à risque</div>
                <div class="chip" data-msg="Donne-moi un conseil méthodologique">Conseil</div>
                <div class="chip" data-msg="Comment bien préparer ma soutenance ?">Soutenance</div>
            </div>

            <div class="typing-indicator" id="typing">
                <i class="bi bi-three-dots"></i> L’assistant réfléchit...
            </div>

            <form id="chat-form" class="d-flex gap-2">
                <input type="text" id="user-input" class="form-control" 
                       placeholder="Écrivez votre message..." autocomplete="off" required>
                <button type="submit" class="btn btn-primary px-3" id="btn-send">
                    <i class="bi bi-send-fill"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
const messagesContainer = document.getElementById('chat-messages');
const historyList = document.getElementById('history-list');
const form = document.getElementById('chat-form');
const input = document.getElementById('user-input');
const typing = document.getElementById('typing');
const btnSend = document.getElementById('btn-send');
const btnNewChat = document.getElementById('btn-new-chat');
const btnClearAll = document.getElementById('btn-clear-all');

let currentChatId = null;

// ========== Gestion des discussions ==========
function getChats() {
    return JSON.parse(localStorage.getItem('ai_chats') || '{}');
}

function saveChats(chats) {
    localStorage.setItem('ai_chats', JSON.stringify(chats));
}

function createNewChat() {
    const id = 'chat_' + Date.now();
    const chats = getChats();
    chats[id] = {
        title: 'Nouvelle discussion',
        messages: [],
        created: new Date().toISOString()
    };
    saveChats(chats);
    currentChatId = id;
    renderHistory();
    renderMessages();
    input.focus();
}

function loadChat(id) {
    currentChatId = id;
    renderHistory();
    renderMessages();
}

function renderHistory() {
    const chats = getChats();
    historyList.innerHTML = '';

    const sorted = Object.entries(chats).sort((a, b) => 
        new Date(b[1].created) - new Date(a[1].created)
    );

    if (sorted.length === 0) {
        historyList.innerHTML = '<div class="text-muted text-center small p-3">Aucune discussion</div>';
        return;
    }

    sorted.forEach(([id, chat]) => {
        const div = document.createElement('div');
        div.className = 'history-item' + (id === currentChatId ? ' active' : '');
        div.textContent = chat.title;
        div.onclick = () => loadChat(id);
        historyList.appendChild(div);
    });
}

function renderMessages() {
    messagesContainer.innerHTML = '';
    const chats = getChats();
    const chat = chats[currentChatId];

    if (!chat || chat.messages.length === 0) {
        messagesContainer.innerHTML = `
            <div class="message bot">
                <div class="avatar"><i class="bi bi-robot"></i></div>
                <div class="message-content">
                    Bonjour <strong>{{ user.first_name|default:user.username }}</strong> 👋<br><br>
                    Je suis votre assistant IA contextuel. Posez-moi une question sur vos projets !
                </div>
            </div>
        `;
        return;
    }

    chat.messages.forEach(msg => {
        appendMessage(msg.role, msg.content, false);
    });
    scrollToBottom();
}

function appendMessage(role, content, animate = true) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    if (!animate) div.style.animation = 'none';

    if (role === 'bot') {
        div.innerHTML = `
            <div class="avatar"><i class="bi bi-robot"></i></div>
            <div class="message-content">${content}</div>
        `;
    } else {
        div.innerHTML = `<div class="message-content">${content}</div>`;
    }
    messagesContainer.appendChild(div);
    scrollToBottom();
}

function scrollToBottom() {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function addMessageToCurrentChat(role, content) {
    const chats = getChats();
    if (!chats[currentChatId]) return;

    chats[currentChatId].messages.push({ role, content });

    // Mettre à jour le titre avec le premier message utilisateur
    if (role === 'user' && chats[currentChatId].messages.filter(m => m.role === 'user').length === 1) {
        chats[currentChatId].title = content.substring(0, 40) + (content.length > 40 ? '...' : '');
    }

    saveChats(chats);
    renderHistory();
}

// ========== Envoi de message ==========
form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const message = input.value.trim();
    if (!message || !currentChatId) return;

    appendMessage('user', message);
    addMessageToCurrentChat('user', message);
    input.value = '';
    btnSend.disabled = true;
    typing.classList.add('active');

    try {
        const response = await fetch("{% url 'chatbot_api' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({ message: message })
        });
        const data = await response.json();
        appendMessage('bot', data.reponse);
        addMessageToCurrentChat('bot', data.reponse);
    } catch (err) {
        appendMessage('bot', "Désolé, une erreur est survenue.");
    }

    typing.classList.remove('active');
    btnSend.disabled = false;
    input.focus();
});

// Suggestions
document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
        input.value = chip.dataset.msg;
        form.dispatchEvent(new Event('submit'));
    });
});

// Nouvelle discussion
btnNewChat.addEventListener('click', createNewChat);

// Tout effacer
btnClearAll.addEventListener('click', () => {
    if (confirm("Supprimer tout l'historique ?")) {
        localStorage.removeItem('ai_chats');
        createNewChat();
    }
});

// Initialisation
const chats = getChats();
if (Object.keys(chats).length === 0) {
    createNewChat();
} else {
    // Charger la discussion la plus récente
    const sorted = Object.entries(chats).sort((a, b) => 
        new Date(b[1].created) - new Date(a[1].created)
    );
    currentChatId = sorted[0][0];
    renderHistory();
    renderMessages();
}

input.focus();
</script>
{% endblock %}
